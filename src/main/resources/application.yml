server:
  port: ${SERVER_PORT:8081}

spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  docs-dir: docs
  # Repo root (golden test docs live in {repo-root}/docs/)
  repo-root: ..
  # Loaded from repo-root .env via spring.config.import (OPENAI_API_KEY=...)
  openai-api-key: ${OPENAI_API_KEY:}
  default-model: gpt-4o-mini
  # Enables POST /api/dev/apply (direct apply bypassing proposals). Local only.
  dev-mode: true
  # LLM provider. Temporary Gemini switch: set LLM_PROVIDER=gemini and
  # GEMINI_API_KEY=... in the repo-root .env file.
  llm:
    provider: ${LLM_PROVIDER:openai}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  # Self-hosted OnlyOffice Document Server (docker/onlyoffice-compose.yml) for
  # manual WYSIWYG editing alongside the AI chat flow. See docs/ONLYOFFICE.md.
  onlyoffice:
    enabled: ${ONLYOFFICE_ENABLED:true}
    document-server-url: ${ONLYOFFICE_DOCUMENT_SERVER_URL:http://localhost:8082}
    # How the Document Server (in Docker) reaches this app to fetch/save
    # documents. host.docker.internal is the Docker Desktop default; override
    # for other setups (a shared docker-compose network, a real hostname).
    callback-base-url: ${ONLYOFFICE_CALLBACK_BASE_URL:http://host.docker.internal:8081}
    # Empty disables JWT (fine for local dev only). Set in production — must
    # match the Document Server's JWT_SECRET.
    jwt-secret: ${ONLYOFFICE_JWT_SECRET:}

logging:
  level:
    com.docgen: INFO
  file:
    name: logs/app.log
