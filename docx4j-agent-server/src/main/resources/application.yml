server:
  port: ${SERVER_PORT:8081}

spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  docs-dir: docs

logging:
  level:
    com.docgen: INFO
  file:
    name: logs/app.log
