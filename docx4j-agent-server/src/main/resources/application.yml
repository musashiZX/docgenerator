server:
  port: ${SERVER_PORT:8081}

spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  docs-dir: docs
  # Repo root (golden test docs live in {repo-root}/docs/)
  repo-root: ..
  # Loaded from repo-root .env via spring.config.import (OPENAI_API_KEY=...)
  openai-api-key: ${OPENAI_API_KEY:}
  default-model: gpt-4o-mini
  # Enables POST /api/dev/apply (direct apply bypassing proposals). Local only.
  dev-mode: true

logging:
  level:
    com.docgen: INFO
  file:
    name: logs/app.log
